           /* MAIN MENU */ 
        .menu { 
            font-family:Comic Sans MS;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            background-color: #dce8ff; 
            padding: 20px; 
            border-radius: 12px; 
        } 
 
        /* MENU ITEMS */ 
        .menu-item { 
            position: relative; 
        } 
 
        .menu a { 
            font-family:Comic Sans MS;
            display: block; 
            background-color: #244a91; 
            color: white; 
            padding: 12px 20px; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: 0.3s ease; 
        } 
 
        /* HOVER EFFECT */ 
        .menu a:hover { 
            font-family:Comic Sans MS;
            background-color: #e5a72c; 
            color: #222; 
            transform: translateY(-5px); 
            box-shadow: 0 0 10px #66148b, 
                        0 0 25px #0ff; 
        } 
 
        /* SUBMENU */ 
        .submenu { 
            font-family:Comic Sans MS;
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 0; 
            min-width: 160px; 
            background-color: #dce8ff; 
            padding: 8px; 
            border-radius: 8px; 
            z-index: 10; 
        } 
 
        /* SHOW SUBMENU WHEN HOVERED */ 
        .menu-item:hover .submenu { 
            display: block; 
        } 
 
        /* SUBMENU LINKS */ 
        .submenu a { 
            font-family:Comic Sans MS;
            background-color: #4169a1; 
            margin: 5px 0; 
            border-radius: 5px; 
        } 
 
        .submenu a:hover { 
            font-family:Comic Sans MS;
            background-color: #e5a72c; 
            transform: translateX(5px); 
        } 
 
    </style>
